<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lái Xe Hộ - Bản đồ thông minh</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root { --primary: #e67e22; --dark: #2c3e50; }
        body { font-family: -apple-system, sans-serif; margin: 0; background: #f8f9fa; overflow: hidden; }
        #map { height: 100vh; width: 100%; z-index: 1; }
        
        .overlay-ui { position: fixed; bottom: 0; width: 100%; z-index: 1000; pointer-events: none; }
        .booking-card { 
            pointer-events: auto; background: white; margin: 15px; padding: 20px; 
            border-radius: 20px; box-shadow: 0 -5px 20px rgba(0,0,0,0.15);
        }
        
        .input-group { background: #f1f2f6; border-radius: 10px; padding: 10px; margin-bottom: 10px; display: flex; align-items: center; border: 1px solid transparent; }
        .input-group.active { border: 1px solid var(--primary); background: #fff; }
        .input-group input { border: none; background: transparent; width: 100%; outline: none; font-size: 16px; margin-left: 10px; }
        
        .btn-order { 
            background: var(--primary); color: white; border: none; 
            width: 100%; padding: 16px; border-radius: 12px; 
            font-size: 18px; font-weight: bold; cursor: pointer;
        }
        .gender-selector { display: flex; gap: 5px; margin-bottom: 10px; }
        .gender-btn { flex:1; padding: 8px; border: 1px solid #ddd; border-radius: 8px; font-size: 12px; text-align: center; background: #fff; }
        .gender-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="overlay-ui">
        <div class="booking-card">
            <div class="gender-selector">
                <div class="gender-btn active" id="g-any" onclick="setGender('any')">Bất kỳ tài xế</div>
                <div class="gender-btn" id="g-male" onclick="setGender('male')">Tài xế Nam</div>
                <div class="gender-btn" id="g-female" onclick="setGender('female')">Tài xế Nữ</div>
            </div>

            <div class="input-group" id="group-pickup">
                📍 <input type="text" id="pickup" placeholder="Điểm đón (Chạm bản đồ để chọn)" onfocus="currentInput='pickup'">
            </div>
            <div class="input-group" id="group-dest">
                🏁 <input type="text" id="destination" placeholder="Điểm đến (Chạm bản đồ để chọn)" onfocus="currentInput='dest'">
            </div>
            
            <button class="btn-order" onclick="processOrder()">GỌI TÀI XẾ NGAY</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyCzWjfcD5Dgq7V-i2izb9tKLR6QM6qWPQo", authDomain: "tavietnam-78ae8.firebaseapp.com", projectId: "tavietnam-78ae8", storageBucket: "tavietnam-78ae8.firebasestorage.app", messagingSenderId: "670121705534", appId: "1:670121705534:web:1027ad98550573ad37116f" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Khởi tạo bản đồ
        const map = L.map('map', { zoomControl: false }).setView([10.7626, 106.6601], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        let pickupMarker = L.marker([0,0], {draggable: true}).addTo(map);
        let destMarker = L.marker([0,0], {draggable: true, icon: L.icon({iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png', shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png', iconSize: [25, 41], iconAnchor: [12, 41]})}).addTo(map);
        
        let currentInput = 'pickup';
        let genderPref = 'any';

        // 1. Tự động lấy vị trí khi mở App
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                map.setView([lat, lng], 16);
                pickupMarker.setLatLng([lat, lng]);
                document.getElementById('pickup').value = "Vị trí của bạn (" + lat.toFixed(4) + ")";
            }, () => { alert("Vui lòng bật định vị GPS!"); });
        }

        // 2. Chạm bản đồ để chọn điểm
        map.on('click', function(e) {
            if(currentInput === 'pickup') {
                pickupMarker.setLatLng(e.latlng);
                document.getElementById('pickup').value = "Điểm đón: " + e.latlng.lat.toFixed(4) + ", " + e.latlng.lng.toFixed(4);
                currentInput = 'dest'; // Sau khi chọn điểm đón, tự chuyển sang điểm đến
                highlightInput();
            } else {
                destMarker.setLatLng(e.latlng);
                document.getElementById('destination').value = "Điểm đến: " + e.latlng.lat.toFixed(4) + ", " + e.latlng.lng.toFixed(4);
            }
        });

        function highlightInput() {
            document.getElementById('group-pickup').classList.toggle('active', currentInput === 'pickup');
            document.getElementById('group-dest').classList.toggle('active', currentInput === 'dest');
        }

        function setGender(val) {
            genderPref = val;
            document.querySelectorAll('.gender-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('g-' + val).classList.add('active');
        }

        async function processOrder() {
            const phone = localStorage.getItem('logged_phone');
            if(!phone) { alert("Vui lòng xác thực SĐT trước!"); return; }

            const pickup = document.getElementById('pickup').value;
            const dest = document.getElementById('destination').value;

            if(!dest) { alert("Vui lòng chọn điểm đến trên bản đồ!"); return; }

            await db.collection("bookings").add({
                customer_phone: phone,
                pickup_coords: [pickupMarker.getLatLng().lat, pickupMarker.getLatLng().lng],
                dest_coords: [destMarker.getLatLng().lat, destMarker.getLatLng().lng],
                pickup_addr: pickup,
                dest_addr: dest,
                driver_gender_pref: genderPref,
                status: "searching",
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            alert("Đang tìm tài xế cho bạn!");
        }
    </script>
</body>
</html>
